{% extends "base.html" %}

{% block title %}Registro{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>📝 Crear Cuenta</h1>
            <p>Regístrate para empezar a crear tickets</p>
        </div>

        <form id="registro-form" class="auth-form">
            <div class="form-group">
                <label for="name">👤 Nombre</label>
                <input type="text" id="name" placeholder="Tu nombre completo" required minlength="3" maxlength="100"
                    pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s]+" title="Solo letras y espacios">
            </div>

            <div class="form-group">
                <label for="email">📧 Email</label>
                <input type="email" id="email" placeholder="tu@email.com" required maxlength="200" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">🔒 Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6"
                    maxlength="200" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirmar">🔒 Confirmar Contraseña</label>
                <input type="password" id="confirmar" placeholder="Repite la contraseña" required minlength="6"
                    maxlength="200">
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="register-btn">
                Crear Cuenta
            </button>
        </form>

        <div class="auth-footer">
            <p>¿Ya tienes cuenta?
                <a href="/login">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Si ya está logueado, redirigir
    (async function () {
        const user = await obtenerUsuarioActual();
        if (user) window.location.href = '/tickets';
    })();

    /**
     * Maneja el envío del formulario de registro.
     * Valida campos y llama a Supabase Auth signUp.
     */
    document.getElementById('registro-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmar = document.getElementById('confirmar').value;

        // Validaciones OWASP
        if (name.length < 3 || name.length > 100) {
            mostrarFlash('El nombre debe tener entre 3 y 100 caracteres', 'error');
            return;
        }

        if (password.length < 6) {
            mostrarFlash('La contraseña debe tener al menos 6 caracteres', 'error');
            return;
        }

        if (password !== confirmar) {
            mostrarFlash('Las contraseñas no coinciden', 'error');
            return;
        }

        const btn = document.getElementById('register-btn');
        btn.disabled = true;
        btn.textContent = 'Creando cuenta...';

        const resultado = await registrarUsuario(name, email, password);

        if (resultado.error) {
            mostrarFlash('No se pudo crear la cuenta. ' + resultado.error, 'error');
            btn.disabled = false;
            btn.textContent = 'Crear Cuenta';
            return;
        }

        mostrarFlash('¡Cuenta creada! Revisa tu email para confirmar o inicia sesión.', 'success');
        setTimeout(function () { window.location.href = '/login'; }, 2000);
    });
</script>
{% endblock %}
