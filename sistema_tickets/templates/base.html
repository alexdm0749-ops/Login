<!-- ============================================================
     templates/base.html
     Plantilla base — carga el SDK de Supabase y el cliente JS
     Autor: Equipo 1º DAM | Proyecto: Sistema de Tickets 1º DAM
     ============================================================ -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Tickets - Gestión de incidencias y sugerencias">
    <title>{% block title %}Sistema de Tickets{% endblock %} — 1º DAM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/tickets" class="nav-brand">🎫 Sistema de Tickets</a>

            <div class="nav-links" id="nav-links" style="display:none;">
                <a href="/tickets" class="nav-link">📋 Tickets</a>
                <a href="/tickets/nuevo" class="nav-link">➕ Nuevo Ticket</a>

                <span id="admin-links" style="display:none;">
                    <a href="/admin/dashboard" class="nav-link">📊 Dashboard</a>
                    <a href="/admin/usuarios" class="nav-link">👥 Usuarios</a>
                </span>

                <div class="nav-user">
                    <span class="nav-user-info">
                        <span id="nav-user-name"></span>
                        <span id="nav-user-role" class="badge badge-role"></span>
                    </span>
                    <a href="#" class="nav-link nav-logout" onclick="logoutUsuario()">🚪 Salir</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Flash messages -->
    <main class="main-content">
        <div id="flash-container" class="flash-messages"></div>

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>Sistema de Tickets — Proyecto 1º DAM — Solutia Innovación y Tecnología</p>
        </div>
    </footer>

    <!-- Supabase SDK (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <!-- Inyectar credenciales de Supabase desde Flask -->
    <script>
        const SUPABASE_URL = '{{ SUPABASE_URL }}';
        const SUPABASE_ANON_KEY = '{{ SUPABASE_ANON_KEY }}';
    </script>

    <!-- Cliente Supabase con todas las funciones -->
    <script src="{{ url_for('static', filename='js/supabase-client.js') }}?v=2"></script>

    <!-- Script específico de cada página -->
    {% block scripts %}{% endblock %}
</body>

</html>
